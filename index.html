<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO & Meta Tags -->
  <title>Shewwina — The Operating System for Customer Flow</title>
  <meta name="description" content="Shewwina helps salons, clinics, restaurants, and service centers manage digital waitlists, online appointment booking, and automated WhatsApp queue alerts to eliminate waiting times." />
  <meta name="keywords" content="digital queue, smart waiting list, salon appointment booking, clinic OPD queue management, customer flow OS, Shewwina" />
  <meta name="author" content="Shewwina Technologies Inc." />

  <!-- Open Graph / Social Meta -->
  <meta property="og:title" content="Shewwina — Stop Waiting. Start Living." />
  <meta property="og:description" content="Manage appointments and live queues digitally. Reduce waiting time by 30% and boost customer satisfaction." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7', /* Soft green */
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e', /* Bright accent green */
              600: '#16a34a',
              700: '#15803d',
              800: '#166534', /* Primary green */
              900: '#14532d',
              950: '#052e16',
            },
            primary: {
              DEFAULT: '#166534',
              hover: '#14532d',
              accent: '#22c55e',
              soft: '#dcfce7',
            },
            surface: {
              subtle: '#f8fafc', /* Main background */
              card: '#ffffff',   /* White cards */
              border: '#e2e8f0',
              dark: '#172033',   /* Main text / dark surface */
              darkCard: '#1e293b',
              darkBorder: '#334155',
            },
            app: {
              bg: '#f8fafc',
              text: '#172033',
              muted: '#64748b',
            }
          },
          boxShadow: {
            subtle: '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            card: '0 1px 3px 0 rgba(23, 32, 51, 0.06), 0 1px 2px -1px rgba(23, 32, 51, 0.06)',
            'card-hover': '0 10px 25px -3px rgba(22, 101, 52, 0.08), 0 4px 6px -4px rgba(22, 101, 52, 0.04)',
            modal: '0 20px 25px -5px rgba(23, 32, 51, 0.15), 0 8px 10px -6px rgba(23, 32, 51, 0.1)',
          },
          animation: {
            'fade-in': 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-down': 'slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-subtle': 'pulseSubtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(-6px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            slideDown: {
              '0%': { opacity: '0', transform: 'translateY(-12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.75' },
            }
          }
        }
      }
    }
  </script>
</head>
<body id="top" class="bg-[#F8FAFC] text-[#172033] font-sans antialiased min-h-screen relative selection:bg-[#22C55E] selection:text-white">
  <div id="root"></div>
  <script type="module" src="/frontend/main.jsx"></script>
</body>
</html>
